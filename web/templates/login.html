{% extends "base.html" %}

{% block title %}Login - Nuki Console{% endblock %}

{% block content %}
<div class="nk-auth-wrap">
    <div class="nk-auth-card">
        <div class="nk-auth-head">
            <div class="nk-auth-emblem"><i class="fas fa-lock"></i></div>
            <h4 class="nk-auth-title">NUKI CONSOLE</h4>
            <p class="nk-auth-sub">Secure access to your smart lock dashboard</p>
        </div>
        <div class="nk-auth-body">
            {% if error %}
            <div class="alert alert-danger py-2"><i class="fas fa-triangle-exclamation me-2"></i>{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required autofocus
       autocomplete="username webauthn" value="{{ request.cookies.get('nuki_login_hint', '') }}">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-unlock me-2"></i>Unlock Console
                    </button>
                </div>
            </form>

            <div class="nk-divider"><span>or</span></div>

            <div class="d-grid">
                <button type="button" class="btn btn-outline-primary nk-passkey-btn d-none" id="passkeyBtn">
                    <i class="fas fa-fingerprint me-2"></i>Sign in with a passkey
                </button>
                <div id="passkeyError" class="alert alert-danger small py-2 mt-2 d-none"></div>
                <p class="nk-passkey-hint d-none" id="passkeyHint">
                    <i class="fas fa-circle-info me-1"></i>Passkeys require HTTPS (or localhost access).
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // WebAuthn only exists in secure contexts (HTTPS or localhost)
    const secure = window.isSecureContext && window.PublicKeyCredential;
    const btn = $('#passkeyBtn');
    const hint = $('#passkeyHint');
    if (window.PublicKeyCredential) {
        btn.removeClass('d-none');
    } else {
        hint.removeClass('d-none');
    }

    // Passkey autofill (conditional mediation): when supported, passkeys for
    // this site appear in the username field's autofill dropdown — tap and
    // sign in with zero typing. Silently skipped when unsupported or when
    // the user has no passkey yet.
    if (window.PublicKeyCredential?.isConditionalMediationAvailable?.()) {
        (async function () {
            try {
                const begin = await fetch('/api/passkeys/auth/begin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: null})
                });
                const options = await begin.json();
                if (!begin.ok) return;
                const publicKey = {
                    challenge: base64urlToBytes(options.publicKey.challenge),
                    rpId: options.publicKey.rpId,
                    userVerification: options.publicKey.userVerification || 'preferred',
                    timeout: options.publicKey.timeout || 60000
                };
                const credential = await navigator.credentials.get({
                    publicKey, mediation: 'conditional'
                });
                const assertion = serializeAssertion(credential);
                const finish = await fetch('/api/passkeys/auth/finish', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(assertion)
                });
                const result = await finish.json();
                if (finish.ok && result.redirect) window.location.href = result.redirect;
            } catch (e) { /* autofill is optional; the button flow remains */ }
        })();
    }

    btn.on('click', async function() {
        btn.prop('disabled', true);
        try {
            // If a username is typed, target that user's stored credentials
            // explicitly (needed for browsers without usernameless discovery,
            // e.g. Firefox on Android)
            const uname = $('input[name=username]').val() || null;
            const begin = await fetch('/api/passkeys/auth/begin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: uname})
            });
            const options = await begin.json();
            if (!begin.ok) { throw new Error(options.error || 'Could not start passkey login'); }

            const publicKey = {
                challenge: base64urlToBytes(options.publicKey.challenge),
                rpId: options.publicKey.rpId,
                userVerification: options.publicKey.userVerification || 'preferred',
                timeout: options.publicKey.timeout || 60000,
                allowCredentials: (options.publicKey.allowCredentials || []).map(c => ({
                    id: base64urlToBytes(c.id), type: c.type
                }))
            };

            const credential = await navigator.credentials.get({publicKey});
            const assertion = serializeAssertion(credential);

            const finish = await fetch('/api/passkeys/auth/finish', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(assertion)
            });
            const result = await finish.json();
            if (!finish.ok) { throw new Error(result.error || 'Passkey login failed'); }
            window.location.href = result.redirect || '/';
        } catch (err) {
            const box = $('#passkeyError');
            let msg;
            if (err.message === 'Unknown passkey') {
                msg = 'That passkey is not registered on this dashboard.';
            } else if (err.name === 'NotAllowedError') {
                msg = 'No passkey was offered — if your browser is Firefox, type your username above and tap this button again (Firefox needs the username to find your passkey). Otherwise the request was cancelled or timed out.';
            } else if (err.name === 'InvalidStateError') {
                msg = 'This device already has a passkey for your account — use it to sign in.';
            } else {
                msg = err.message;
            }
            box.text(msg);
            box.removeClass('d-none');
            btn.prop('disabled', false);
        }
    });

    function base64urlToBytes(value) {
        const pad = '='.repeat((4 - (value.length % 4)) % 4);
        const raw = atob(value.replace(/-/g, '+').replace(/_/g, '/') + pad);
        return Uint8Array.from(raw, c => c.charCodeAt(0));
    }

    function b64url(buf) {
        return btoa(String.fromCharCode(...new Uint8Array(buf)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function serializeAssertion(credential) {
        const r = credential.response;
        return {
            id: credential.id,
            rawId: credential.id,
            type: credential.type,
            response: {
                clientDataJSON: b64url(r.clientDataJSON),
                authenticatorData: b64url(r.authenticatorData),
                signature: b64url(r.signature),
                userHandle: r.userHandle ? b64url(r.userHandle) : null
            }
        };
    }
});
</script>
{% endblock %}
